name: Build and Release DeadOrbit

permissions:
  contents: write

on:
  push:
    branches: [main]

env:
  PROJECT: DeadOrbit.csproj
  CONFIGURATION: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            rid: linux-x64

          - os: windows-latest
            name: windows
            rid: win-x64

          - os: macos-latest
            name: macos
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish (clean game build)
        run: |
          dotnet publish $PROJECT \
            -c $CONFIGURATION \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o build/${{ matrix.name }}

      - name: Package game build
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}

          # Copy ONLY what you need
          cp -r build/${{ matrix.name }}/* dist/${{ matrix.name }}/

          # OPTIONAL: keep only game assets explicitly
          if [ -d "Content" ]; then
            cp -r Content dist/${{ matrix.name }}/Content
          fi

          if [ -d "Assets" ]; then
            cp -r Assets dist/${{ matrix.name }}/Assets
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadorbit-${{ matrix.name }}
          path: dist/${{ matrix.name }}/**
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        run: |
          VERSION=$(dotnet msbuild DeadOrbit.csproj -getProperty:Version | tail -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v$VERSION" || true
          git push origin "v$VERSION" || true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "DeadOrbit v$VERSION" \
            --generate-notes || true

      - name: Upload Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts/deadorbit-windows
          zip -r ../../windows.zip .

          gh release upload "v$VERSION" ../../windows.zip --clobber

      - name: Upload Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts/deadorbit-linux
          tar -czf ../../linux.tar.gz .

          gh release upload "v$VERSION" ../../linux.tar.gz --clobber

      - name: Upload macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts/deadorbit-macos
          tar -czf ../../macos.tar.gz .

          gh release upload "v$VERSION" ../../macos.tar.gz --clobber
