name: Build and Release DeadOrbit

permissions:
  contents: write

on:
  push:
    branches: [main]

env:
  PROJECT: DeadOrbit.csproj
  CONFIGURATION: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            rid: linux-x64

          - os: windows-latest
            name: windows
            rid: win-x64

          - os: macos-latest
            name: macos
            rid: osx-x64

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(dotnet msbuild $PROJECT -getProperty:Version | tail -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: |
          dotnet publish $PROJECT \
            -c $CONFIGURATION \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o publish/${{ matrix.name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadorbit-${{ matrix.name }}
          path: publish/${{ matrix.name }}/**
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        run: |
          VERSION=$(dotnet msbuild $PROJECT -getProperty:Version | tail -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "v$VERSION" || true
          git push origin "v$VERSION" || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "DeadOrbit v$VERSION" \
            --generate-notes || true

      - name: Upload Windows build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$VERSION" artifacts/deadorbit-windows/** --clobber || true

      - name: Upload Linux build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$VERSION" artifacts/deadorbit-linux/** --clobber || true

      - name: Upload macOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$VERSION" artifacts/deadorbit-macos/** --clobber || true
