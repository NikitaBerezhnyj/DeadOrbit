name: Build and Release DeadOrbit

permissions:
  contents: write

on:
  push:
    branches: [main]

env:
  PROJECT: DeadOrbit.csproj
  CONFIGURATION: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            rid: linux-x64
          - os: windows-latest
            name: windows
            rid: win-x64
          - os: macos-latest
            name: macos
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        shell: bash
        run: dotnet restore

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c "$CONFIGURATION" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "publish/${{ matrix.name }}"

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist

          if [ "${{ matrix.name }}" = "windows" ]; then
            cd "publish/${{ matrix.name }}"
            7z a "../../dist/deadorbit-windows.zip" .
          elif [ "${{ matrix.name }}" = "linux" ]; then
            tar -czf "dist/deadorbit-linux.tar.gz" -C "publish/${{ matrix.name }}" .
          else
            tar -czf "dist/deadorbit-macos.tar.gz" -C "publish/${{ matrix.name }}" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadorbit-${{ matrix.name }}
          path: dist/deadorbit-${{ matrix.name }}.*
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Extract version
        run: |
          VERSION=$(dotnet msbuild $PROJECT -getProperty:Version | tail -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v$VERSION" || true
          git push origin "v$VERSION" || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "DeadOrbit v$VERSION" \
            --generate-notes || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$VERSION" \
            artifacts/deadorbit-windows/deadorbit-windows.zip \
            artifacts/deadorbit-linux/deadorbit-linux.tar.gz \
            artifacts/deadorbit-macos/deadorbit-macos.tar.gz \
            --clobber
